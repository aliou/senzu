[package]
name = "senzu-appearance"
version = "0.7.0"
edition = "2021"
description = "Report the terminal's current appearance (dark/light) via OSC 11"
license = "MIT"

[[bin]]
name = "senzu-appearance"
path = "src/main.rs"

[dependencies]
libc = "0.2"

[dev-dependencies]
# The pty tests drive a real terminal from the master side.
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
