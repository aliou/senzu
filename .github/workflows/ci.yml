name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Verify bundle works
        run: node packages/cli/dist/index.mjs --help

      - name: Verify themes are fresh
        run: |
          pnpm run generate
          if ! git diff --exit-code -- share/; then
            echo "share/ is out of date. Run: pnpm generate"
            exit 1
          fi

  native:
    name: Appearance probe
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        run: rustup component add clippy rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: cargo-${{ runner.os }}-${{ hashFiles('native/Cargo.lock') }}

      - name: Format
        run: cargo fmt --manifest-path native/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path native/Cargo.toml --all-targets -- -D warnings

      # Includes the pty tests, which fork a real terminal.
      - name: Test
        run: cargo test --manifest-path native/Cargo.toml

      - name: Verify the probe version matches the release version
        run: |
          RELEASE=$(jq -r '.version' package.json)
          PROBE=$(grep -m1 '^version = ' native/Cargo.toml | cut -d'"' -f2)
          if [ "$RELEASE" != "$PROBE" ]; then
            echo "native/Cargo.toml is $PROBE but package.json is $RELEASE."
            echo "The release workflow builds the binary at the release version."
            echo "Run: just sync-version"
            exit 1
          fi
