#:schema https://yazi-rs.github.io/schemas/theme.json
# Senzu flavor: Senzu Dusk
# Generated by senzu

[app]
overall = { fg = "#d2cbec", bg = "#16141b" }

[mgr]
cwd = { fg = "#668799", bold = true }
find_keyword = { fg = "#fad07a", bold = true, italic = true, underline = true }
find_position = { fg = "#c6b6ee", bg = "reset", bold = true, italic = true }
symlink_target = { fg = "#668799", italic = true }
marker_copied = { fg = "#afd787", bg = "#afd787" }
marker_cut = { fg = "#d74545", bg = "#d74545" }
marker_marked = { fg = "#5f9ecf", bg = "#5f9ecf" }
marker_selected = { fg = "#fad07a", bg = "#fad07a" }
count_copied = { fg = "#16141b", bg = "#afd787" }
count_cut = { fg = "#16141b", bg = "#d74545" }
count_selected = { fg = "#16141b", bg = "#fad07a" }
border_style = { fg = "#2d283b" }

[tabs]
active = { fg = "#16141b", bg = "#d0c5ed", bold = true }
inactive = { fg = "#5d596a", bg = "#16141b" }

[mode]
normal_main = { fg = "#16141b", bg = "#d0c5ed", bold = true }
normal_alt = { fg = "#d0c5ed", bg = "#16141b" }
select_main = { fg = "#16141b", bg = "#668799", bold = true }
select_alt = { fg = "#668799", bg = "#16141b" }
unset_main = { fg = "#16141b", bg = "#d74545", bold = true }
unset_alt = { fg = "#d74545", bg = "#16141b" }

[indicator]
parent = { fg = "#5d596a" }
current = { fg = "#d0c5ed" }
preview = { fg = "#668799" }

[status]
overall = { fg = "#d2cbec", bg = "#16141b" }
perm_sep = { fg = "#5d596a" }
perm_type = { fg = "#8197bf" }
perm_read = { fg = "#fad07a" }
perm_write = { fg = "#d74545" }
perm_exec = { fg = "#afd787" }
progress_label = { fg = "#d2cbec", bold = true }
progress_normal = { fg = "#afd787", bg = "#16141b" }
progress_error = { fg = "#ffaf00", bg = "#d74545" }

[which]
mask = { bg = "#1b1723" }
cand = { fg = "#668799" }
rest = { fg = "#5d596a" }
desc = { fg = "#c6b6ee" }
separator_style = { fg = "#2d283b" }

[confirm]
border = { fg = "#d0c5ed" }
title = { fg = "#d0c5ed", bold = true }
body = { fg = "#d2cbec" }
list = { fg = "#d2cbec" }
btn_yes = { fg = "#16141b", bg = "#afd787", bold = true }
btn_no = { fg = "#d2cbec", bg = "#16141b" }

[spot]
border = { fg = "#d0c5ed" }
title = { fg = "#d0c5ed", bold = true }
tbl_col = { fg = "#668799" }
tbl_cell = { fg = "#fad07a", bg = "#16141b" }

[notify]
title_info = { fg = "#afd787" }
title_warn = { fg = "#ffaf00" }
title_error = { fg = "#d74545" }

[pick]
border = { fg = "#d0c5ed" }
active = { fg = "#c6b6ee", bold = true }
inactive = { fg = "#5d596a" }

[input]
border = { fg = "#d0c5ed" }
title = { fg = "#d2cbec" }
value = { fg = "#d2cbec" }
selected = { fg = "#d2cbec", bg = "#393449" }

[cmp]
border = { fg = "#d0c5ed" }
active = { fg = "#d2cbec", bg = "#393449" }
inactive = { fg = "#5d596a" }

[tasks]
border = { fg = "#d0c5ed" }
title = { fg = "#d2cbec" }
hovered = { fg = "#c6b6ee", bold = true }

[help]
on = { fg = "#668799" }
run = { fg = "#c6b6ee" }
desc = { fg = "#d2cbec" }
hovered = { fg = "#d2cbec", bg = "#393449", bold = true }
footer = { fg = "#16141b", bg = "#d2cbec" }

[filetype]
rules = [
  { mime = "image/*", fg = "#668799" },
  { mime = "{audio,video}/*", fg = "#c6b6ee" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#d74545" },
  { mime = "application/{pdf,doc,rtf}", fg = "#fad07a" },
  { mime = "vfs/{absent,stale}", fg = "#5d596a" },
  { url = "*", is = "orphan", bg = "#d74545" },
  { url = "*", is = "exec", fg = "#afd787" },
  { url = "*/", fg = "#8197bf" },
  { url = "*", fg = "#d2cbec" },
]
