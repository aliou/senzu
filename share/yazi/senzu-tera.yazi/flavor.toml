#:schema https://yazi-rs.github.io/schemas/theme.json
# Senzu flavor: Senzu Tera
# Generated by senzu

[app]
overall = { fg = "#e6eaea", bg = "#152528" }

[mgr]
cwd = { fg = "#a1cdd8", bold = true }
find_keyword = { fg = "#fda47f", bold = true, italic = true, underline = true }
find_position = { fg = "#ad5c7c", bg = "reset", bold = true, italic = true }
symlink_target = { fg = "#a1cdd8", italic = true }
marker_copied = { fg = "#7aa4a1", bg = "#7aa4a1" }
marker_cut = { fg = "#e85c51", bg = "#e85c51" }
marker_marked = { fg = "#5a93aa", bg = "#5a93aa" }
marker_selected = { fg = "#fda47f", bg = "#fda47f" }
count_copied = { fg = "#152528", bg = "#7aa4a1" }
count_cut = { fg = "#152528", bg = "#e85c51" }
count_selected = { fg = "#152528", bg = "#fda47f" }
border_style = { fg = "#2d4f56" }

[tabs]
active = { fg = "#152528", bg = "#a1cdd8", bold = true }
inactive = { fg = "#587b7b", bg = "#152528" }

[mode]
normal_main = { fg = "#152528", bg = "#a1cdd8", bold = true }
normal_alt = { fg = "#a1cdd8", bg = "#152528" }
select_main = { fg = "#152528", bg = "#a1cdd8", bold = true }
select_alt = { fg = "#a1cdd8", bg = "#152528" }
unset_main = { fg = "#152528", bg = "#e85c51", bold = true }
unset_alt = { fg = "#e85c51", bg = "#152528" }

[indicator]
parent = { fg = "#587b7b" }
current = { fg = "#a1cdd8" }
preview = { fg = "#a1cdd8" }

[status]
overall = { fg = "#e6eaea", bg = "#152528" }
perm_sep = { fg = "#587b7b" }
perm_type = { fg = "#5a93aa" }
perm_read = { fg = "#fda47f" }
perm_write = { fg = "#e85c51" }
perm_exec = { fg = "#7aa4a1" }
progress_label = { fg = "#e6eaea", bold = true }
progress_normal = { fg = "#7aa4a1", bg = "#152528" }
progress_error = { fg = "#fda47f", bg = "#e85c51" }

[which]
mask = { bg = "#1d3337" }
cand = { fg = "#a1cdd8" }
rest = { fg = "#587b7b" }
desc = { fg = "#ad5c7c" }
separator_style = { fg = "#2d4f56" }

[confirm]
border = { fg = "#a1cdd8" }
title = { fg = "#a1cdd8", bold = true }
body = { fg = "#e6eaea" }
list = { fg = "#e6eaea" }
btn_yes = { fg = "#152528", bg = "#7aa4a1", bold = true }
btn_no = { fg = "#e6eaea", bg = "#152528" }

[spot]
border = { fg = "#a1cdd8" }
title = { fg = "#a1cdd8", bold = true }
tbl_col = { fg = "#a1cdd8" }
tbl_cell = { fg = "#fda47f", bg = "#152528" }

[notify]
title_info = { fg = "#7aa4a1" }
title_warn = { fg = "#fda47f" }
title_error = { fg = "#e85c51" }

[pick]
border = { fg = "#a1cdd8" }
active = { fg = "#ad5c7c", bold = true }
inactive = { fg = "#587b7b" }

[input]
border = { fg = "#a1cdd8" }
title = { fg = "#e6eaea" }
value = { fg = "#e6eaea" }
selected = { fg = "#e6eaea", bg = "#293e40" }

[cmp]
border = { fg = "#a1cdd8" }
active = { fg = "#e6eaea", bg = "#293e40" }
inactive = { fg = "#587b7b" }

[tasks]
border = { fg = "#a1cdd8" }
title = { fg = "#e6eaea" }
hovered = { fg = "#ad5c7c", bold = true }

[help]
on = { fg = "#a1cdd8" }
run = { fg = "#ad5c7c" }
desc = { fg = "#e6eaea" }
hovered = { fg = "#e6eaea", bg = "#293e40", bold = true }
footer = { fg = "#152528", bg = "#e6eaea" }

[filetype]
rules = [
  { mime = "image/*", fg = "#a1cdd8" },
  { mime = "{audio,video}/*", fg = "#ad5c7c" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#e85c51" },
  { mime = "application/{pdf,doc,rtf}", fg = "#fda47f" },
  { mime = "vfs/{absent,stale}", fg = "#587b7b" },
  { url = "*", is = "orphan", bg = "#e85c51" },
  { url = "*", is = "exec", fg = "#7aa4a1" },
  { url = "*/", fg = "#5a93aa" },
  { url = "*", fg = "#e6eaea" },
]
