#:schema https://yazi-rs.github.io/schemas/theme.json
# Senzu flavor: Senzu Tera Light
# Generated by senzu

[app]
overall = { fg = "#1a2c2f", bg = "#eaf8fb" }

[mgr]
cwd = { fg = "#037a8f", bold = true }
find_keyword = { fg = "#9b4b28", bold = true, italic = true, underline = true }
find_position = { fg = "#9c4d6d", bg = "reset", bold = true, italic = true }
symlink_target = { fg = "#037a8f", italic = true }
marker_copied = { fg = "#48716e", bg = "#48716e" }
marker_cut = { fg = "#c43a33", bg = "#c43a33" }
marker_marked = { fg = "#2b647a", bg = "#2b647a" }
marker_selected = { fg = "#9b4b28", bg = "#9b4b28" }
count_copied = { fg = "#eaf8fb", bg = "#48716e" }
count_cut = { fg = "#eaf8fb", bg = "#c43a33" }
count_selected = { fg = "#eaf8fb", bg = "#9b4b28" }
border_style = { fg = "#c7d8da" }

[tabs]
active = { fg = "#eaf8fb", bg = "#037a8f", bold = true }
inactive = { fg = "#4e686d", bg = "#eaf8fb" }

[mode]
normal_main = { fg = "#eaf8fb", bg = "#037a8f", bold = true }
normal_alt = { fg = "#037a8f", bg = "#eaf8fb" }
select_main = { fg = "#eaf8fb", bg = "#037a8f", bold = true }
select_alt = { fg = "#037a8f", bg = "#eaf8fb" }
unset_main = { fg = "#eaf8fb", bg = "#c43a33", bold = true }
unset_alt = { fg = "#c43a33", bg = "#eaf8fb" }

[indicator]
parent = { fg = "#4e686d" }
current = { fg = "#037a8f" }
preview = { fg = "#037a8f" }

[status]
overall = { fg = "#1a2c2f", bg = "#eaf8fb" }
perm_sep = { fg = "#4e686d" }
perm_type = { fg = "#2b647a" }
perm_read = { fg = "#9b4b28" }
perm_write = { fg = "#c43a33" }
perm_exec = { fg = "#48716e" }
progress_label = { fg = "#1a2c2f", bold = true }
progress_normal = { fg = "#48716e", bg = "#eaf8fb" }
progress_error = { fg = "#9b4b28", bg = "#c43a33" }

[which]
mask = { bg = "#dbedef" }
cand = { fg = "#037a8f" }
rest = { fg = "#4e686d" }
desc = { fg = "#9c4d6d" }
separator_style = { fg = "#c7d8da" }

[confirm]
border = { fg = "#037a8f" }
title = { fg = "#037a8f", bold = true }
body = { fg = "#1a2c2f" }
list = { fg = "#1a2c2f" }
btn_yes = { fg = "#eaf8fb", bg = "#48716e", bold = true }
btn_no = { fg = "#1a2c2f", bg = "#eaf8fb" }

[spot]
border = { fg = "#037a8f" }
title = { fg = "#037a8f", bold = true }
tbl_col = { fg = "#037a8f" }
tbl_cell = { fg = "#9b4b28", bg = "#eaf8fb" }

[notify]
title_info = { fg = "#48716e" }
title_warn = { fg = "#9b4b28" }
title_error = { fg = "#c43a33" }

[pick]
border = { fg = "#037a8f" }
active = { fg = "#9c4d6d", bold = true }
inactive = { fg = "#4e686d" }

[input]
border = { fg = "#037a8f" }
title = { fg = "#1a2c2f" }
value = { fg = "#1a2c2f" }
selected = { fg = "#1a2c2f", bg = "#afd5da" }

[cmp]
border = { fg = "#037a8f" }
active = { fg = "#1a2c2f", bg = "#afd5da" }
inactive = { fg = "#4e686d" }

[tasks]
border = { fg = "#037a8f" }
title = { fg = "#1a2c2f" }
hovered = { fg = "#9c4d6d", bold = true }

[help]
on = { fg = "#037a8f" }
run = { fg = "#9c4d6d" }
desc = { fg = "#1a2c2f" }
hovered = { fg = "#1a2c2f", bg = "#afd5da", bold = true }
footer = { fg = "#eaf8fb", bg = "#1a2c2f" }

[filetype]
rules = [
  { mime = "image/*", fg = "#037a8f" },
  { mime = "{audio,video}/*", fg = "#9c4d6d" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#c43a33" },
  { mime = "application/{pdf,doc,rtf}", fg = "#9b4b28" },
  { mime = "vfs/{absent,stale}", fg = "#4e686d" },
  { url = "*", is = "orphan", bg = "#c43a33" },
  { url = "*", is = "exec", fg = "#48716e" },
  { url = "*/", fg = "#2b647a" },
  { url = "*", fg = "#1a2c2f" },
]
