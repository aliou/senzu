#:schema https://yazi-rs.github.io/schemas/theme.json
# Senzu flavor: Senzu Cold Light
# Generated by senzu

[app]
overall = { fg = "#1f2a34", bg = "#edf6ff" }

[mgr]
cwd = { fg = "#2B5B77", bold = true }
find_keyword = { fg = "#876820", bold = true, italic = true, underline = true }
find_position = { fg = "#6a4abd", bg = "reset", bold = true, italic = true }
symlink_target = { fg = "#2B5B77", italic = true }
marker_copied = { fg = "#386014", bg = "#386014" }
marker_cut = { fg = "#ff3333", bg = "#ff3333" }
marker_marked = { fg = "#2a6f9c", bg = "#2a6f9c" }
marker_selected = { fg = "#876820", bg = "#876820" }
count_copied = { fg = "#edf6ff", bg = "#386014" }
count_cut = { fg = "#edf6ff", bg = "#ff3333" }
count_selected = { fg = "#edf6ff", bg = "#876820" }
border_style = { fg = "#cad6e0" }

[tabs]
active = { fg = "#edf6ff", bg = "#234291", bold = true }
inactive = { fg = "#556575", bg = "#edf6ff" }

[mode]
normal_main = { fg = "#edf6ff", bg = "#234291", bold = true }
normal_alt = { fg = "#234291", bg = "#edf6ff" }
select_main = { fg = "#edf6ff", bg = "#2B5B77", bold = true }
select_alt = { fg = "#2B5B77", bg = "#edf6ff" }
unset_main = { fg = "#edf6ff", bg = "#ff3333", bold = true }
unset_alt = { fg = "#ff3333", bg = "#edf6ff" }

[indicator]
parent = { fg = "#556575" }
current = { fg = "#234291" }
preview = { fg = "#2B5B77" }

[status]
overall = { fg = "#1f2a34", bg = "#edf6ff" }
perm_sep = { fg = "#556575" }
perm_type = { fg = "#2952a3" }
perm_read = { fg = "#876820" }
perm_write = { fg = "#ff3333" }
perm_exec = { fg = "#386014" }
progress_label = { fg = "#1f2a34", bold = true }
progress_normal = { fg = "#386014", bg = "#edf6ff" }
progress_error = { fg = "#a66510", bg = "#ff3333" }

[which]
mask = { bg = "#deebf5" }
cand = { fg = "#2B5B77" }
rest = { fg = "#556575" }
desc = { fg = "#6a4abd" }
separator_style = { fg = "#cad6e0" }

[confirm]
border = { fg = "#234291" }
title = { fg = "#234291", bold = true }
body = { fg = "#1f2a34" }
list = { fg = "#1f2a34" }
btn_yes = { fg = "#edf6ff", bg = "#386014", bold = true }
btn_no = { fg = "#1f2a34", bg = "#edf6ff" }

[spot]
border = { fg = "#234291" }
title = { fg = "#234291", bold = true }
tbl_col = { fg = "#2B5B77" }
tbl_cell = { fg = "#876820", bg = "#edf6ff" }

[notify]
title_info = { fg = "#386014" }
title_warn = { fg = "#a66510" }
title_error = { fg = "#ff3333" }

[pick]
border = { fg = "#234291" }
active = { fg = "#6a4abd", bold = true }
inactive = { fg = "#556575" }

[input]
border = { fg = "#234291" }
title = { fg = "#1f2a34" }
value = { fg = "#1f2a34" }
selected = { fg = "#1f2a34", bg = "#b8d0e6" }

[cmp]
border = { fg = "#234291" }
active = { fg = "#1f2a34", bg = "#b8d0e6" }
inactive = { fg = "#556575" }

[tasks]
border = { fg = "#234291" }
title = { fg = "#1f2a34" }
hovered = { fg = "#6a4abd", bold = true }

[help]
on = { fg = "#2B5B77" }
run = { fg = "#6a4abd" }
desc = { fg = "#1f2a34" }
hovered = { fg = "#1f2a34", bg = "#b8d0e6", bold = true }
footer = { fg = "#edf6ff", bg = "#1f2a34" }

[filetype]
rules = [
  { mime = "image/*", fg = "#2B5B77" },
  { mime = "{audio,video}/*", fg = "#6a4abd" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ff3333" },
  { mime = "application/{pdf,doc,rtf}", fg = "#876820" },
  { mime = "vfs/{absent,stale}", fg = "#556575" },
  { url = "*", is = "orphan", bg = "#ff3333" },
  { url = "*", is = "exec", fg = "#386014" },
  { url = "*/", fg = "#2952a3" },
  { url = "*", fg = "#1f2a34" },
]
