# Senzu Theme for Hunk (legacy format): Senzu Mono Light
# Generated by senzu
#
# For hunk <= 0.17, which only supports the single-slot [custom_theme] table.
# Replace any existing [custom_theme] in ~/.config/hunk/config.toml with these
# tables and set:
#
#   theme = "custom"
#
# Only one custom theme can exist at a time in this format. On hunk >= 0.18
# prefer senzu-mono-light.toml, which also carries exact Shiki
# syntax scope colors.

[custom_theme]
base = "github-light-default"
label = "Senzu Mono Light"
background = "#f5f0e8"
panel = "#f5f0e8"
panelAlt = "#e8e0d5"
border = "#d0ccd1"
accent = "#4a5e81"
accentMuted = "#576270"
text = "#252525"
muted = "#605958"
addedBg = "#e7e5d4"
removedBg = "#efdbd0"
movedAddedBg = "#c7d5db"
movedRemovedBg = "#d4dddf"
contextBg = "#f5f0e8"
addedContentBg = "#e4e4d1"
removedContentBg = "#eed8cc"
contextContentBg = "#ebe4da"
addedSignColor = "#99ad6a"
removedSignColor = "#cf6a4c"
lineNumberBg = "#f5f0e8"
lineNumberFg = "#605958"
selectedHunk = "#576270"
badgeAdded = "#99ad6a"
badgeRemoved = "#cf6a4c"
badgeNeutral = "#605958"
fileNew = "#99ad6a"
fileDeleted = "#cf6a4c"
fileRenamed = "#4a5e81"
fileModified = "#fad07a"
fileUntracked = "#99ad6a"
noteBorder = "#4a5e81"
noteBackground = "#e8e0d5"
noteTitleBackground = "#d5d0cb"
noteTitleText = "#4a5e81"

[custom_theme.syntax]
default = "#252525"
keyword = "#787878"
string = "#796858"
comment = "#909090"
number = "#7d7163"
function = "#4a5e81"
property = "#252525"
type = "#7d7163"
variable = "#252525"
operator = "#4a5e81"
punctuation = "#252525"
