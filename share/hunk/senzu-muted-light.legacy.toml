# Senzu Theme for Hunk (legacy format): Senzu Muted Light
# Generated by senzu
#
# For hunk <= 0.17, which only supports the single-slot [custom_theme] table.
# Replace any existing [custom_theme] in ~/.config/hunk/config.toml with these
# tables and set:
#
#   theme = "custom"
#
# Only one custom theme can exist at a time in this format. On hunk >= 0.18
# prefer senzu-muted-light.toml, which also carries exact Shiki
# syntax scope colors.

[custom_theme]
base = "github-light-default"
label = "Senzu Muted Light"
background = "#f7f3eb"
panel = "#f7f3eb"
panelAlt = "#ebe7df"
border = "#d0cdc6"
accent = "#3c5971"
accentMuted = "#536271"
text = "#2d2c2a"
muted = "#5c5650"
addedBg = "#dcdfce"
removedBg = "#edd8d2"
movedAddedBg = "#d3dad9"
movedRemovedBg = "#dee1de"
contextBg = "#f7f3eb"
addedContentBg = "#d8dcca"
removedContentBg = "#ecd4ce"
contextContentBg = "#eeeae2"
addedSignColor = "#4d7134"
removedSignColor = "#b84949"
lineNumberBg = "#f7f3eb"
lineNumberFg = "#5c5650"
selectedHunk = "#536271"
badgeAdded = "#4d7134"
badgeRemoved = "#b84949"
badgeNeutral = "#5c5650"
fileNew = "#4d7134"
fileDeleted = "#b84949"
fileRenamed = "#3c5971"
fileModified = "#9a7345"
fileUntracked = "#4d7134"
noteBorder = "#3c5971"
noteBackground = "#ebe7df"
noteTitleBackground = "#d6d6d2"
noteTitleText = "#3c5971"

[custom_theme.syntax]
default = "#2d2c2a"
keyword = "#445987"
string = "#6d7f59"
comment = "#787775"
number = "#8c594a"
function = "#987b40"
property = "#2d2c2a"
type = "#a07542"
variable = "#2d2c2a"
operator = "#3c5971"
punctuation = "#2d2c2a"
