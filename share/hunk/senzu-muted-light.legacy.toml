# Senzu Theme for Hunk (legacy format): Senzu Muted Light
# Generated by senzu
#
# For hunk <= 0.17, which only supports the single-slot [custom_theme] table.
# Replace any existing [custom_theme] in ~/.config/hunk/config.toml with these
# tables and set:
#
#   theme = "custom"
#
# Only one custom theme can exist at a time in this format. On hunk >= 0.18
# prefer senzu-muted-light.toml, which also carries exact Shiki
# syntax scope colors.

[custom_theme]
base = "github-light-default"
label = "Senzu Muted Light"
background = "#f7f3eb"
panel = "#f7f3eb"
panelAlt = "#ebe7df"
border = "#d0cdc6"
accent = "#3c5971"
accentMuted = "#536271"
text = "#2d2c2a"
muted = "#5c5650"
addedBg = "#e8e8d7"
removedBg = "#f1ded2"
movedAddedBg = "#d3dad9"
movedRemovedBg = "#dee1de"
contextBg = "#f7f3eb"
addedContentBg = "#e6e6d4"
removedContentBg = "#f0dace"
contextContentBg = "#eeeae2"
addedSignColor = "#99ad6a"
removedSignColor = "#cf6a4c"
lineNumberBg = "#f7f3eb"
lineNumberFg = "#5c5650"
selectedHunk = "#536271"
badgeAdded = "#99ad6a"
badgeRemoved = "#cf6a4c"
badgeNeutral = "#5c5650"
fileNew = "#99ad6a"
fileDeleted = "#cf6a4c"
fileRenamed = "#3c5971"
fileModified = "#fad07a"
fileUntracked = "#99ad6a"
noteBorder = "#3c5971"
noteBackground = "#ebe7df"
noteTitleBackground = "#d6d6d2"
noteTitleText = "#3c5971"

[custom_theme.syntax]
default = "#2d2c2a"
keyword = "#445987"
string = "#6d7f59"
comment = "#787775"
number = "#8c594a"
function = "#987b40"
property = "#2d2c2a"
type = "#a07542"
variable = "#2d2c2a"
operator = "#3c5971"
punctuation = "#2d2c2a"
