# Senzu Theme for Hunk: Senzu Cold Light
# Generated by senzu
#
# Hunk has no standalone theme files. Merge these tables into
# ~/.config/hunk/config.toml (or a repo's .hunk/config.toml), then select the
# theme with:
#
#   theme = "senzu-cold-light"
#
# or press "t" inside Hunk and pick "Senzu Cold Light".
#
# Requires hunk >= 0.18. For hunk <= 0.17 use senzu-cold-light.legacy.toml instead.

