# Senzu Theme for Hunk (legacy format): Senzu
# Generated by senzu
#
# For hunk <= 0.17, which only supports the single-slot [custom_theme] table.
# Replace any existing [custom_theme] in ~/.config/hunk/config.toml with these
# tables and set:
#
#   theme = "custom"
#
# Only one custom theme can exist at a time in this format. On hunk >= 0.18
# prefer senzu.toml, which also carries exact Shiki
# syntax scope colors.

[custom_theme]
base = "github-dark-default"
label = "Senzu"
background = "#151515"
panel = "#151515"
panelAlt = "#1c1c1c"
border = "#403c41"
accent = "#8fbfdc"
accentMuted = "#556779"
text = "#e8e8d3"
muted = "#605958"
addedBg = "#322b11"
removedBg = "#590a0f"
movedAddedBg = "#232f38"
movedRemovedBg = "#1f272e"
contextBg = "#151515"
addedContentBg = "#3a3f2d"
removedContentBg = "#492d24"
contextContentBg = "#1a1a1a"
addedSignColor = "#99ad6a"
removedSignColor = "#cf6a4c"
lineNumberBg = "#151515"
lineNumberFg = "#605958"
selectedHunk = "#556779"
badgeAdded = "#99ad6a"
badgeRemoved = "#cf6a4c"
