# Senzu Theme for Hunk (legacy format): Senzu Warm
# Generated by senzu
#
# For hunk <= 0.17, which only supports the single-slot [custom_theme] table.
# Replace any existing [custom_theme] in ~/.config/hunk/config.toml with these
# tables and set:
#
#   theme = "custom"
#
# Only one custom theme can exist at a time in this format. On hunk >= 0.18
# prefer senzu-warm.toml, which also carries exact Shiki
# syntax scope colors.

[custom_theme]
base = "github-dark-default"
label = "Senzu Warm"
background = "#1c1510"
panel = "#1c1510"
panelAlt = "#241a10"
border = "#3c2c1c"
accent = "#8fbfdc"
accentMuted = "#5a5038"
text = "#edd9b8"
muted = "#6a5a50"
addedBg = "#322b11"
removedBg = "#590a0f"
movedAddedBg = "#292f34"
movedRemovedBg = "#252729"
contextBg = "#1c1510"
addedContentBg = "#3f3f29"
removedContentBg = "#4e2d21"
contextContentBg = "#221910"
addedSignColor = "#99ad6a"
removedSignColor = "#cf6a4c"
lineNumberBg = "#1c1510"
lineNumberFg = "#6a5a50"
selectedHunk = "#5a5038"
badgeAdded = "#99ad6a"
badgeRemoved = "#cf6a4c"
badgeNeutral = "#6a5a50"
fileNew = "#99ad6a"
fileDeleted = "#cf6a4c"
fileRenamed = "#8fbfdc"
fileModified = "#fad07a"
fileUntracked = "#99ad6a"
noteBorder = "#8fbfdc"
noteBackground = "#241a10"
