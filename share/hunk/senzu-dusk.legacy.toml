text = "#d2cbec"
muted = "#5d596a"
addedBg = "#322b11"
removedBg = "#590a0f"
movedAddedBg = "#242e3d"
movedRemovedBg = "#202633"
contextBg = "#16141b"
addedContentBg = "#3a3f31"
removedContentBg = "#4a2c29"
contextContentBg = "#1a1621"
addedSignColor = "#99ad6a"
removedSignColor = "#cf6a4c"
lineNumberBg = "#16141b"
lineNumberFg = "#5d596a"
selectedHunk = "#4a4358"
badgeAdded = "#99ad6a"
badgeRemoved = "#cf6a4c"
badgeNeutral = "#5d596a"
fileNew = "#99ad6a"
fileDeleted = "#cf6a4c"
