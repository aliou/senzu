# Senzu Theme for Hunk (legacy format): Senzu Dusk
# Generated by senzu
#
# For hunk <= 0.17, which only supports the single-slot [custom_theme] table.
# Replace any existing [custom_theme] in ~/.config/hunk/config.toml with these
# tables and set:
#
#   theme = "custom"
#
# Only one custom theme can exist at a time in this format. On hunk >= 0.18
# prefer senzu-dusk.toml, which also carries exact Shiki
# syntax scope colors.

[custom_theme]
base = "github-dark-default"
label = "Senzu Dusk"
background = "#16141b"
panel = "#16141b"
panelAlt = "#1b1723"
border = "#2d283b"
accent = "#8fbfdc"
