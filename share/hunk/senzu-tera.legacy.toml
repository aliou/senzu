# Senzu Theme for Hunk (legacy format): Senzu Tera
# Generated by senzu
#
# For hunk <= 0.17, which only supports the single-slot [custom_theme] table.
# Replace any existing [custom_theme] in ~/.config/hunk/config.toml with these
# tables and set:
#
#   theme = "custom"
#
# Only one custom theme can exist at a time in this format. On hunk >= 0.18
# prefer senzu-tera.toml, which also carries exact Shiki
# syntax scope colors.

[custom_theme]
base = "github-dark-default"
label = "Senzu Tera"
background = "#152528"
panel = "#152528"
panelAlt = "#1d3337"
border = "#2d4f56"
accent = "#a1cdd8"
accentMuted = "#2f4d52"
text = "#e6eaea"
muted = "#587b7b"
addedBg = "#293e40"
removedBg = "#4a3332"
movedAddedBg = "#223a40"
movedRemovedBg = "#1e3439"
contextBg = "#152528"
addedContentBg = "#31484a"
removedContentBg = "#503433"
contextContentBg = "#1b2f33"
addedSignColor = "#7aa4a1"
removedSignColor = "#e85c51"
lineNumberBg = "#152528"
lineNumberFg = "#587b7b"
selectedHunk = "#2f4d52"
badgeAdded = "#7aa4a1"
badgeRemoved = "#e85c51"
badgeNeutral = "#587b7b"
fileNew = "#7aa4a1"
fileDeleted = "#e85c51"
fileRenamed = "#a1cdd8"
fileModified = "#fda47f"
fileUntracked = "#7aa4a1"
noteBorder = "#a1cdd8"
noteBackground = "#1d3337"
noteTitleBackground = "#2d464b"
