# Senzu Theme for Hunk (legacy format): Senzu Tera Light
# Generated by senzu
#
# For hunk <= 0.17, which only supports the single-slot [custom_theme] table.
# Replace any existing [custom_theme] in ~/.config/hunk/config.toml with these
# tables and set:
#
#   theme = "custom"
#
# Only one custom theme can exist at a time in this format. On hunk >= 0.18
# prefer senzu-tera-light.toml, which also carries exact Shiki
# syntax scope colors.

[custom_theme]
base = "github-light-default"
label = "Senzu Tera Light"
background = "#eaf8fb"
panel = "#eaf8fb"
panelAlt = "#dbedef"
border = "#c7d8da"
accent = "#037a8f"
accentMuted = "#375a60"
text = "#1a2c2f"
muted = "#4e686d"
addedBg = "#d1e3e5"
removedBg = "#e4dadc"
movedAddedBg = "#c6dce3"
movedRemovedBg = "#d1e4ea"
contextBg = "#eaf8fb"
addedContentBg = "#cde0e2"
removedContentBg = "#e3d6d7"
contextContentBg = "#dff0f2"
addedSignColor = "#48716e"
removedSignColor = "#c43a33"
lineNumberBg = "#eaf8fb"
lineNumberFg = "#4e686d"
selectedHunk = "#375a60"
badgeAdded = "#48716e"
badgeRemoved = "#c43a33"
badgeNeutral = "#4e686d"
fileNew = "#48716e"
fileDeleted = "#c43a33"
fileRenamed = "#037a8f"
fileModified = "#9b4b28"
fileUntracked = "#48716e"
noteBorder = "#037a8f"
noteBackground = "#dbedef"
noteTitleBackground = "#c1dfe3"
noteTitleText = "#037a8f"

[custom_theme.syntax]
default = "#1a2c2f"
keyword = "#9c4d6d"
string = "#48716e"
comment = "#677884"
number = "#bb4d0c"
function = "#18546a"
property = "#2b647a"
type = "#9b4b28"
