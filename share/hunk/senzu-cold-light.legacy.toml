# Senzu Theme for Hunk (legacy format): Senzu Cold Light
# Generated by senzu
#
# For hunk <= 0.17, which only supports the single-slot [custom_theme] table.
# Replace any existing [custom_theme] in ~/.config/hunk/config.toml with these
# tables and set:
#
#   theme = "custom"
#
# Only one custom theme can exist at a time in this format. On hunk >= 0.18
# prefer senzu-cold-light.toml, which also carries exact Shiki
# syntax scope colors.

[custom_theme]
base = "github-light-default"
label = "Senzu Cold Light"
background = "#edf6ff"
panel = "#edf6ff"
panelAlt = "#deebf5"
border = "#cad6e0"
accent = "#2b5b77"
accentMuted = "#41566a"
text = "#1f2a34"
muted = "#556575"
addedBg = "#e0ebe8"
removedBg = "#e8e0e3"
movedAddedBg = "#c8ddec"
movedRemovedBg = "#d3e4f2"
contextBg = "#edf6ff"
addedContentBg = "#dee9e4"
removedContentBg = "#e8dddf"
contextContentBg = "#e2eef8"
addedSignColor = "#99ad6a"
removedSignColor = "#cf6a4c"
lineNumberBg = "#edf6ff"
lineNumberFg = "#556575"
selectedHunk = "#41566a"
badgeAdded = "#99ad6a"
badgeRemoved = "#cf6a4c"
badgeNeutral = "#556575"
fileNew = "#99ad6a"
fileDeleted = "#cf6a4c"
fileRenamed = "#2B5B77"
fileModified = "#fad07a"
fileUntracked = "#99ad6a"
noteBorder = "#2b5b77"
noteBackground = "#deebf5"
noteTitleBackground = "#c8d9e6"
noteTitleText = "#2b5b77"

[custom_theme.syntax]
default = "#1f2a34"
keyword = "#2952a3"
string = "#658349"
comment = "#708090"
number = "#954d3b"
function = "#876820"
property = "#1f2a34"
type = "#b87520"
variable = "#1f2a34"
operator = "#2B5B77"
punctuation = "#1f2a34"
