# Senzu Theme for Hunk: Senzu HC
# Generated by senzu
#
# Hunk has no standalone theme files. Merge these tables into
# ~/.config/hunk/config.toml (or a repo's .hunk/config.toml), then select the
# theme with:
#
#   theme = "senzu-hc"
#
# or press "t" inside Hunk and pick "Senzu HC".
#
# Requires hunk >= 0.18. For hunk <= 0.17 use senzu-hc.legacy.toml instead.

[themes.senzu-hc]
base = "github-dark-default"
label = "Senzu HC"
background = "#060606"
