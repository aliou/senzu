# Senzu Theme for Hunk: Senzu Warm
# Generated by senzu
#
# Hunk has no standalone theme files. Merge these tables into
# ~/.config/hunk/config.toml (or a repo's .hunk/config.toml), then select the
# theme with:
#
#   theme = "senzu-warm"
#
# or press "t" inside Hunk and pick "Senzu Warm".
#
# Requires hunk >= 0.18. For hunk <= 0.17 use senzu-warm.legacy.toml instead.

