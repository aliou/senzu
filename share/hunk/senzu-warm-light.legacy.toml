# Senzu Theme for Hunk (legacy format): Senzu Warm Light
# Generated by senzu
#
# For hunk <= 0.17, which only supports the single-slot [custom_theme] table.
# Replace any existing [custom_theme] in ~/.config/hunk/config.toml with these
# tables and set:
#
#   theme = "custom"
#
# Only one custom theme can exist at a time in this format. On hunk >= 0.18
# prefer senzu-warm-light.toml, which also carries exact Shiki
# syntax scope colors.

[custom_theme]
base = "github-light-default"
label = "Senzu Warm Light"
background = "#fbead6"
panel = "#fbead6"
panelAlt = "#eed9c2"
border = "#d6c6b6"
accent = "#2b5b77"
accentMuted = "#6a563a"
text = "#2b241d"
muted = "#68584a"
addedBg = "#ece0c5"
removedBg = "#f4d6c0"
movedAddedBg = "#e6cfb6"
movedRemovedBg = "#ecd7bf"
contextBg = "#fbead6"
addedContentBg = "#e9dfc3"
removedContentBg = "#f3d3bd"
contextContentBg = "#f1ddc7"
addedSignColor = "#99ad6a"
removedSignColor = "#cf6a4c"
lineNumberBg = "#fbead6"
lineNumberFg = "#68584a"
selectedHunk = "#6a563a"
badgeAdded = "#99ad6a"
badgeRemoved = "#cf6a4c"
badgeNeutral = "#68584a"
fileNew = "#99ad6a"
fileDeleted = "#cf6a4c"
fileRenamed = "#2B5B77"
fileModified = "#fad07a"
fileUntracked = "#99ad6a"
noteBorder = "#2b5b77"
noteBackground = "#eed9c2"
noteTitleBackground = "#d6cab9"
noteTitleText = "#2b5b77"

[custom_theme.syntax]
default = "#2b241d"
keyword = "#2952a3"
string = "#658349"
comment = "#827568"
number = "#954d3b"
function = "#876820"
