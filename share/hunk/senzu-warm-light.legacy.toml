# Senzu Theme for Hunk (legacy format): Senzu Warm Light
# Generated by senzu
#
# For hunk <= 0.17, which only supports the single-slot [custom_theme] table.
# Replace any existing [custom_theme] in ~/.config/hunk/config.toml with these
# tables and set:
#
#   theme = "custom"
#
# Only one custom theme can exist at a time in this format. On hunk >= 0.18
# prefer senzu-warm-light.toml, which also carries exact Shiki
# syntax scope colors.

[custom_theme]
base = "github-light-default"
label = "Senzu Warm Light"
background = "#fbead6"
panel = "#fbead6"
panelAlt = "#eed9c2"
border = "#d6c6b6"
accent = "#2b5b77"
accentMuted = "#6a563a"
text = "#2b241d"
muted = "#68584a"
addedBg = "#dcd4b8"
removedBg = "#fccdbc"
movedAddedBg = "#e6cfb6"
movedRemovedBg = "#ecd7bf"
contextBg = "#fbead6"
addedContentBg = "#d8d1b3"
removedContentBg = "#fcc9b9"
contextContentBg = "#f1ddc7"
addedSignColor = "#386014"
removedSignColor = "#ff3333"
lineNumberBg = "#fbead6"
lineNumberFg = "#68584a"
selectedHunk = "#6a563a"
badgeAdded = "#386014"
badgeRemoved = "#ff3333"
badgeNeutral = "#68584a"
fileNew = "#386014"
fileDeleted = "#ff3333"
fileRenamed = "#2B5B77"
fileModified = "#a66510"
fileUntracked = "#386014"
noteBorder = "#2b5b77"
noteBackground = "#eed9c2"
noteTitleBackground = "#d6cab9"
noteTitleText = "#2b5b77"

[custom_theme.syntax]
default = "#2b241d"
keyword = "#2952a3"
string = "#658349"
comment = "#827568"
number = "#954d3b"
function = "#876820"
property = "#2b241d"
type = "#b87520"
variable = "#2b241d"
operator = "#2B5B77"
punctuation = "#2b241d"
