# Senzu Theme for Hunk (legacy format): Senzu Mono
# Generated by senzu
#
# For hunk <= 0.17, which only supports the single-slot [custom_theme] table.
# Replace any existing [custom_theme] in ~/.config/hunk/config.toml with these
# tables and set:
#
#   theme = "custom"
#
# Only one custom theme can exist at a time in this format. On hunk >= 0.18
# prefer senzu-mono.toml, which also carries exact Shiki
# syntax scope colors.

[custom_theme]
base = "github-dark-default"
label = "Senzu Mono"
background = "#151515"
panel = "#151515"
panelAlt = "#1c1c1c"
border = "#403c41"
accent = "#7a8aa6"
accentMuted = "#556779"
text = "#e8e8d3"
muted = "#605958"
addedBg = "#322b11"
removedBg = "#590a0f"
movedAddedBg = "#282b30"
movedRemovedBg = "#222528"
contextBg = "#151515"
addedContentBg = "#3a3f2d"
removedContentBg = "#492d24"
contextContentBg = "#1a1a1a"
addedSignColor = "#99ad6a"
removedSignColor = "#cf6a4c"
lineNumberBg = "#151515"
lineNumberFg = "#605958"
selectedHunk = "#556779"
badgeAdded = "#99ad6a"
badgeRemoved = "#cf6a4c"
badgeNeutral = "#605958"
fileNew = "#99ad6a"
fileDeleted = "#cf6a4c"
fileRenamed = "#7a8aa6"
fileModified = "#fad07a"
fileUntracked = "#99ad6a"
noteBorder = "#7a8aa6"
noteBackground = "#1c1c1c"
noteTitleBackground = "#27292d"
noteTitleText = "#7a8aa6"

[custom_theme.syntax]
default = "#e8e8d3"
keyword = "#888888"
string = "#a08070"
comment = "#606060"
number = "#b39066"
function = "#7a8aa6"
property = "#e8e8d3"
type = "#b39066"
variable = "#e8e8d3"
operator = "#7a8aa6"
punctuation = "#e8e8d3"
