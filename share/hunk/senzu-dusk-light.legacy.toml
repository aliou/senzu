# Senzu Theme for Hunk (legacy format): Senzu Dusk Light
# Generated by senzu
#
# For hunk <= 0.17, which only supports the single-slot [custom_theme] table.
# Replace any existing [custom_theme] in ~/.config/hunk/config.toml with these
# tables and set:
#
#   theme = "custom"
#
# Only one custom theme can exist at a time in this format. On hunk >= 0.18
# prefer senzu-dusk-light.toml, which also carries exact Shiki
# syntax scope colors.

[custom_theme]
base = "github-light-default"
label = "Senzu Dusk Light"
background = "#f6f3fe"
panel = "#f6f3fe"
panelAlt = "#e8e7f5"
border = "#d4d2e0"
accent = "#2b5b77"
accentMuted = "#564f68"
text = "#2a2633"
muted = "#655f73"
addedBg = "#d8dcd9"
removedBg = "#f7d5de"
movedAddedBg = "#dbd7ec"
movedRemovedBg = "#e3dff1"
contextBg = "#f6f3fe"
addedContentBg = "#d4d8d4"
removedContentBg = "#f8d0d9"
contextContentBg = "#eceaf7"
addedSignColor = "#386014"
removedSignColor = "#ff3333"
lineNumberBg = "#f6f3fe"
lineNumberFg = "#655f73"
selectedHunk = "#564f68"
badgeAdded = "#386014"
badgeRemoved = "#ff3333"
badgeNeutral = "#655f73"
fileNew = "#386014"
fileDeleted = "#ff3333"
fileRenamed = "#2B5B77"
fileModified = "#a66510"
fileUntracked = "#386014"
noteBorder = "#2b5b77"
noteBackground = "#e8e7f5"
