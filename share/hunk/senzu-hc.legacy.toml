# Senzu Theme for Hunk (legacy format): Senzu HC
# Generated by senzu
#
# For hunk <= 0.17, which only supports the single-slot [custom_theme] table.
# Replace any existing [custom_theme] in ~/.config/hunk/config.toml with these
# tables and set:
#
#   theme = "custom"
#
# Only one custom theme can exist at a time in this format. On hunk >= 0.18
# prefer senzu-hc.toml, which also carries exact Shiki
# syntax scope colors.

[custom_theme]
base = "github-dark-default"
label = "Senzu HC"
background = "#060606"
panel = "#060606"
panelAlt = "#0e0e0e"
border = "#282828"
accent = "#aad4f8"
accentMuted = "#556779"
text = "#f8f8f0"
muted = "#605958"
addedBg = "#322b11"
removedBg = "#590a0f"
movedAddedBg = "#172835"
movedRemovedBg = "#121e27"
contextBg = "#060606"
addedContentBg = "#2f3422"
removedContentBg = "#3e2219"
contextContentBg = "#0c0c0c"
addedSignColor = "#99ad6a"
removedSignColor = "#cf6a4c"
lineNumberBg = "#060606"
lineNumberFg = "#605958"
selectedHunk = "#556779"
badgeAdded = "#99ad6a"
badgeRemoved = "#cf6a4c"
badgeNeutral = "#605958"
fileNew = "#99ad6a"
fileDeleted = "#cf6a4c"
fileRenamed = "#aad4f8"
fileModified = "#fad07a"
fileUntracked = "#99ad6a"
noteBorder = "#aad4f8"
noteBackground = "#0e0e0e"
noteTitleBackground = "#21262a"
noteTitleText = "#aad4f8"

[custom_theme.syntax]
default = "#f8f8f0"
keyword = "#98b0e0"
string = "#c0d880"
comment = "#909090"
number = "#f0a080"
function = "#ffe080"
property = "#f8f8f0"
