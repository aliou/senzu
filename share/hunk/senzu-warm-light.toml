# Senzu Theme for Hunk: Senzu Warm Light
# Generated by senzu
#
# Hunk has no standalone theme files. Merge these tables into
# ~/.config/hunk/config.toml (or a repo's .hunk/config.toml), then select the
# theme with:
#
#   theme = "senzu-warm-light"
#
# or press "t" inside Hunk and pick "Senzu Warm Light".
#
# Requires hunk >= 0.18. For hunk <= 0.17 use senzu-warm-light.legacy.toml instead.

