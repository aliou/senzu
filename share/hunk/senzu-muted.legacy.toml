# Senzu Theme for Hunk (legacy format): Senzu Muted
# Generated by senzu
#
# For hunk <= 0.17, which only supports the single-slot [custom_theme] table.
# Replace any existing [custom_theme] in ~/.config/hunk/config.toml with these
# tables and set:
#
#   theme = "custom"
#
# Only one custom theme can exist at a time in this format. On hunk >= 0.18
# prefer senzu-muted.toml, which also carries exact Shiki
# syntax scope colors.

[custom_theme]
base = "github-dark-default"
label = "Senzu Muted"
background = "#101010"
panel = "#101010"
panelAlt = "#1e1e1c"
border = "#3c3936"
accent = "#83adc3"
accentMuted = "#4f5c69"
text = "#dad6c8"
muted = "#58534f"
addedBg = "#322b11"
removedBg = "#590a0f"
movedAddedBg = "#252f33"
movedRemovedBg = "#1f2629"
contextBg = "#101010"
addedContentBg = "#363c29"
removedContentBg = "#452921"
contextContentBg = "#1a1a19"
addedSignColor = "#99ad6a"
removedSignColor = "#cf6a4c"
lineNumberBg = "#101010"
lineNumberFg = "#58534f"
selectedHunk = "#4f5c69"
badgeAdded = "#99ad6a"
badgeRemoved = "#cf6a4c"
badgeNeutral = "#58534f"
fileNew = "#99ad6a"
fileDeleted = "#cf6a4c"
fileRenamed = "#83adc3"
fileModified = "#fad07a"
fileUntracked = "#99ad6a"
noteBorder = "#83adc3"
noteBackground = "#1e1e1c"
noteTitleBackground = "#2a2f30"
noteTitleText = "#83adc3"

[custom_theme.syntax]
default = "#dad6c8"
keyword = "#7a8aa6"
string = "#909c6e"
comment = "#7a7a7a"
number = "#c88a77"
function = "#e8c88c"
property = "#dad6c8"
type = "#d8a16c"
variable = "#dad6c8"
operator = "#83adc3"
punctuation = "#dad6c8"
