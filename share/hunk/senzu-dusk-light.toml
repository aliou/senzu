# Senzu Theme for Hunk: Senzu Dusk Light
# Generated by senzu
#
# Hunk has no standalone theme files. Merge these tables into
# ~/.config/hunk/config.toml (or a repo's .hunk/config.toml), then select the
# theme with:
#
#   theme = "senzu-dusk-light"
#
# or press "t" inside Hunk and pick "Senzu Dusk Light".
#
# Requires hunk >= 0.18. For hunk <= 0.17 use senzu-dusk-light.legacy.toml instead.

