# Senzu Theme for Hunk: Senzu Mono Light
# Generated by senzu
#
# Hunk has no standalone theme files. Merge these tables into
# ~/.config/hunk/config.toml (or a repo's .hunk/config.toml), then select the
# theme with:
#
#   theme = "senzu-mono-light"
#
# or press "t" inside Hunk and pick "Senzu Mono Light".
#
# Requires hunk >= 0.18. For hunk <= 0.17 use senzu-mono-light.legacy.toml instead.

