# Senzu Theme for Hunk (legacy format): Senzu Light
# Generated by senzu
#
# For hunk <= 0.17, which only supports the single-slot [custom_theme] table.
# Replace any existing [custom_theme] in ~/.config/hunk/config.toml with these
# tables and set:
#
#   theme = "custom"
#
# Only one custom theme can exist at a time in this format. On hunk >= 0.18
# prefer senzu-light.toml, which also carries exact Shiki
# syntax scope colors.

[custom_theme]
base = "github-light-default"
label = "Senzu Light"
background = "#f5e6d3"
panel = "#f5e6d3"
panelAlt = "#e8d5c0"
border = "#d0ccd1"
accent = "#2b5b77"
accentMuted = "#556779"
text = "#252525"
muted = "#605958"
addedBg = "#e7ddc3"
removedBg = "#efd3be"
movedAddedBg = "#cbd0cc"
movedRemovedBg = "#d7d6ce"
contextBg = "#f5e6d3"
addedContentBg = "#e4dcc0"
removedContentBg = "#eed0bb"
contextContentBg = "#ebd9c5"
addedSignColor = "#99ad6a"
removedSignColor = "#cf6a4c"
lineNumberBg = "#f5e6d3"
lineNumberFg = "#605958"
selectedHunk = "#556779"
badgeAdded = "#99ad6a"
badgeRemoved = "#cf6a4c"
badgeNeutral = "#605958"
fileNew = "#99ad6a"
fileDeleted = "#cf6a4c"
fileRenamed = "#2B5B77"
fileModified = "#fad07a"
fileUntracked = "#99ad6a"
noteBorder = "#2b5b77"
noteBackground = "#e8d5c0"
noteTitleBackground = "#d1c6b7"
noteTitleText = "#2b5b77"

[custom_theme.syntax]
default = "#252525"
keyword = "#2952a3"
string = "#658349"
comment = "#787878"
number = "#954d3b"
function = "#876820"
property = "#252525"
type = "#b87520"
variable = "#252525"
operator = "#2B5B77"
punctuation = "#252525"
