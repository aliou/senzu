# Senzu Theme for Hunk (legacy format): Senzu HC Light
# Generated by senzu
#
# For hunk <= 0.17, which only supports the single-slot [custom_theme] table.
# Replace any existing [custom_theme] in ~/.config/hunk/config.toml with these
# tables and set:
#
#   theme = "custom"
#
# Only one custom theme can exist at a time in this format. On hunk >= 0.18
# prefer senzu-hc-light.toml, which also carries exact Shiki
# syntax scope colors.

[custom_theme]
base = "github-light-default"
label = "Senzu HC Light"
background = "#fafafa"
panel = "#fafafa"
panelAlt = "#f0f0f0"
border = "#e0e0e0"
accent = "#0a4a7a"
accentMuted = "#4a6070"
text = "#000000"
muted = "#605958"
addedBg = "#ebeee3"
removedBg = "#f3e3df"
movedAddedBg = "#cdd9e5"
movedRemovedBg = "#dae3eb"
contextBg = "#fafafa"
addedContentBg = "#e9ece0"
removedContentBg = "#f2e0db"
contextContentBg = "#f3f3f3"
addedSignColor = "#99ad6a"
removedSignColor = "#cf6a4c"
lineNumberBg = "#fafafa"
lineNumberFg = "#605958"
selectedHunk = "#4a6070"
badgeAdded = "#99ad6a"
badgeRemoved = "#cf6a4c"
badgeNeutral = "#605958"
fileNew = "#99ad6a"
fileDeleted = "#cf6a4c"
fileRenamed = "#0a4a7a"
fileModified = "#fad07a"
fileUntracked = "#99ad6a"
noteBorder = "#0a4a7a"
noteBackground = "#f0f0f0"
noteTitleBackground = "#d4dce2"
noteTitleText = "#0a4a7a"

[custom_theme.syntax]
default = "#000000"
keyword = "#1a3a80"
string = "#507020"
comment = "#404040"
number = "#8a3a10"
function = "#7a5000"
property = "#000000"
type = "#8a5000"
variable = "#000000"
operator = "#0a4a7a"
punctuation = "#000000"
