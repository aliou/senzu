# Senzu Theme for Hunk (legacy format): Senzu HC Light
# Generated by senzu
#
# For hunk <= 0.17, which only supports the single-slot [custom_theme] table.
# Replace any existing [custom_theme] in ~/.config/hunk/config.toml with these
# tables and set:
#
#   theme = "custom"
#
# Only one custom theme can exist at a time in this format. On hunk >= 0.18
# prefer senzu-hc-light.toml, which also carries exact Shiki
# syntax scope colors.

[custom_theme]
base = "github-light-default"
label = "Senzu HC Light"
background = "#fafafa"
panel = "#fafafa"
panelAlt = "#f0f0f0"
border = "#e0e0e0"
accent = "#0a4a7a"
accentMuted = "#4a6070"
text = "#000000"
muted = "#605958"
addedBg = "#d8e1d5"
removedBg = "#f1d3d3"
movedAddedBg = "#cdd9e5"
movedRemovedBg = "#dae3eb"
contextBg = "#fafafa"
addedContentBg = "#d2ded0"
removedContentBg = "#f0cdcd"
contextContentBg = "#f3f3f3"
addedSignColor = "#1f5d10"
removedSignColor = "#c00000"
lineNumberBg = "#fafafa"
lineNumberFg = "#605958"
selectedHunk = "#4a6070"
badgeAdded = "#1f5d10"
badgeRemoved = "#c00000"
badgeNeutral = "#605958"
fileNew = "#1f5d10"
fileDeleted = "#c00000"
fileRenamed = "#0a4a7a"
fileModified = "#8a4a00"
fileUntracked = "#1f5d10"
noteBorder = "#0a4a7a"
noteBackground = "#f0f0f0"
noteTitleBackground = "#d4dce2"
noteTitleText = "#0a4a7a"

[custom_theme.syntax]
default = "#000000"
keyword = "#1a3a80"
string = "#507020"
comment = "#404040"
number = "#8a3a10"
function = "#7a5000"
property = "#000000"
type = "#8a5000"
variable = "#000000"
operator = "#0a4a7a"
punctuation = "#000000"
